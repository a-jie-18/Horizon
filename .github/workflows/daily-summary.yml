name: Daily Horizon Summary
on:
  schedule:
    # GitHub 定时任务使用 UTC 时间。23:00 UTC = 次日 07:00 北京时间
    - cron: '0 23 * * *'
  workflow_dispatch:      # 允许手动触发
jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限以提交更改
    env:
      TZ: Asia/Shanghai  # 全 job 使用北京时间，确保 Horizon 文件名与提交信息一致
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - name: Install dependencies
        run: uv sync
      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json
      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours 24
      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
